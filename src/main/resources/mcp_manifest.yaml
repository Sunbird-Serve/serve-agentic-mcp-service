{
  "tools": [
    {
      "name": "raiseNeed",
      "description": "Raise a teaching need for a school in Sunbird Serve",
      "input_schema": {
        "type": "object",
        "properties": {
          "grade": {
            "type": "string",
            "description": "Grade for which the need is raised (e.g., 6)"
          },
          "subject": {
            "type": "string",
            "description": "Subject to be taught (e.g., English)"
          },
          "startDate": {
            "type": "string",
            "format": "date-time",
            "description": "Start date in ISO format (e.g., 2025-06-15T00:00:00Z)"
          },
          "endDate": {
            "type": "string",
            "format": "date-time",
            "description": "End date in ISO format (e.g., 2025-07-15T00:00:00Z)"
          },
          "frequency": {
            "type": "string",
            "description": "Session frequency, e.g., WEEKLY"
          },
          "days": {
            "type": "array",
            "items": {
              "type": "string"
            },
            "description": "List of days like Monday, Wednesday"
          },
          "timeSlots": {
            "type": "array",
            "description": "List of time slots",
            "items": {
              "type": "object",
              "properties": {
                "day": {
                  "type": "string",
                  "description": "Day of the session"
                },
                "startTime": {
                  "type": "string",
                  "format": "date-time",
                  "description": "Start time in ISO format"
                },
                "endTime": {
                  "type": "string",
                  "format": "date-time",
                  "description": "End time in ISO format"
                }
              },
              "required": ["day", "startTime", "endTime"]
            }
          }
        },
        "required": ["grade", "subject", "startDate", "endDate", "days", "timeSlots"]
      }
    }
  ]
}
